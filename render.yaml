services:
  # ==============================================================================
  # 🍛 Curvada's Kitchen — 1 Unified Web Service (Backend API + Web App + WebSocket)
  # ==============================================================================
  - type: web
    name: curvadas-kitchen
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build && cd backend && npm install && npm run build
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: prod
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false # Set in Render Dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: '*'
