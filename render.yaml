services:
  # ==============================================================================
  # 1. 🧪 Curvada's Kitchen — Staging Service (Branch: staging)
  # ==============================================================================
  - type: web
    name: curvadas-kitchen-staging
    runtime: node
    branch: staging
    plan: starter
    buildCommand: npm install && npm run build:stg && cd backend && npm install && npm run build
    startCommand: cd backend && npm run start:stg
    envVars:
      - key: NODE_ENV
        value: staging
      - key: APP_ENV
        value: stg
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        value: mongodb://lancejomer09_db_user:3zADz5SpXb47O2eP@ac-jmky1sd-shard-00-00.cj9fy1d.mongodb.net:27017,ac-jmky1sd-shard-00-01.cj9fy1d.mongodb.net:27017,ac-jmky1sd-shard-00-02.cj9fy1d.mongodb.net:27017/curvadas_kitchen_stg?ssl=true&replicaSet=atlas-sqq432-shard-0&authSource=admin&appName=Curvadaskitchen
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: '*'

  # ==============================================================================
  # 2. 🚀 Curvada's Kitchen — Production Service (Branch: main)
  # ==============================================================================
  - type: web
    name: curvadas-kitchen-prod
    runtime: node
    branch: main
    plan: starter
    buildCommand: npm install && npm run build:prod && cd backend && npm install && npm run build
    startCommand: cd backend && npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: prod
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        value: mongodb://lancejomer09_db_user:3zADz5SpXb47O2eP@ac-jmky1sd-shard-00-00.cj9fy1d.mongodb.net:27017,ac-jmky1sd-shard-00-01.cj9fy1d.mongodb.net:27017,ac-jmky1sd-shard-00-02.cj9fy1d.mongodb.net:27017/curvadas_kitchen?ssl=true&replicaSet=atlas-sqq432-shard-0&authSource=admin&appName=Curvadaskitchen
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: '*'
