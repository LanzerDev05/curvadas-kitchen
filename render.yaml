services:
  # ==========================================
  # 1. Curvada's Kitchen Standalone Backend
  # ==========================================
  - type: web
    name: curvadas-backend
    runtime: node
    rootDir: backend
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: prod
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false # Set securely in Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: '*'

  # ==========================================
  # 2. Curvada's Kitchen Web App (React)
  # ==========================================
  - type: web
    name: curvadas-webapp
    runtime: static
    plan: starter
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_APP_ENV
        value: production
      - key: VITE_BACKEND_URL
        fromService:
          type: web
          name: curvadas-backend
          property: host
